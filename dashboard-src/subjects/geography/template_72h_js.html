<script>(function(){
var $=function(s,r){return(r||document).querySelector(s)},$$=function(s,r){return[].slice.call((r||document).querySelectorAll(s))};
var D=JSON.parse($("#pqd").textContent),side=$("#side"),scrim=$("#scrim"),q=$("#q"),last="home",done=[];
try{done=JSON.parse(localStorage.getItem("pol72-done")||"[]")}catch(e){}
function save(){try{localStorage.setItem("pol72-done",JSON.stringify(done))}catch(e){}}
function paint(){$$(".side a[data-v]").forEach(function(a){a.classList.toggle("ok",done.indexOf(+a.dataset.v.slice(1))>=0)});
 $$("[data-done]").forEach(function(b){var on=done.indexOf(+b.dataset.done)>=0;b.classList.toggle("is",on);b.textContent=on?"Hour "+b.dataset.done+" done ✓":"Mark hour "+b.dataset.done+" done"});
 $("#prog").textContent=done.length+" of 72 hours done";$("#bar").style.width=(100*done.length/72)+"%";
 var nx=1;while(done.indexOf(nx)>=0&&nx<72)nx++;var c=$("#cont");c.href="#h"+nx;c.textContent=(done.length?"Continue with hour ":"Start with hour ")+nx+" →"}
function drawer(o){side.classList.toggle("open",o);scrim.classList.toggle("on",o)}
function fill(v){var ol=$(".pq",v);if(!ol||ol.dataset.f)return;ol.dataset.f=1;var st={d:0,r:0,t:0};
 ol.innerHTML=ol.dataset.q.split(",").map(function(i){var x=D[i];st.t++;return'<li data-i="'+i+'"><div class="meta">'+x.e+'</div><div class="stem">'+x.s+'</div><div class="opts">'+x.o.map(function(o,j){return'<button type="button" class="o" data-j="'+j+'">('+"abcde"[j]+') '+o+'</button>'}).join("")+'</div><div class="fb" hidden></div></li>'}).join("");
 var sc=$(".score",v);function show(){sc.textContent=st.t+" questions · answered "+st.d+" · correct "+st.r+(st.d?" ("+Math.round(100*st.r/st.d)+"%)":"")}show();
 ol.addEventListener("click",function(e){var b=e.target.closest(".o");if(!b||b.disabled)return;var li=b.closest("li"),x=D[li.dataset.i],j=+b.dataset.j,ok=x.k.indexOf(j)>=0;
  $$(".o",li).forEach(function(o,n){o.disabled=true;if(x.k.indexOf(n)>=0)o.classList.add("ok");else if(n===j)o.classList.add("no")});
  var fb=$(".fb",li);fb.hidden=false;fb.innerHTML='<b class="'+(ok?"ok":"no")+'">'+(ok?"Correct.":"Not correct.")+"</b> "+x.f+(x.n>1?' <span class="p up">UPPSC ×'+x.n+"</span>":"")+"";
  st.d++;if(ok)st.r++;show()})}
function show(id){$$(".view").forEach(function(v){v.classList.toggle("on",v.id===id)});$$(".side a").forEach(function(a){a.classList.toggle("on",a.dataset.v===id)});
 if(id!=="results")last=id;var v=$("#"+id);fill(v);document.title=(v.dataset.n?"Hour "+v.dataset.n+" · ":"")+"Polity in 72h";var a=$(".side a.on");if(a&&a.scrollIntoView)a.scrollIntoView({block:"nearest"})}
function route(){var h=location.hash.slice(1)||"home";if(!document.getElementById(h))h="home";q.value="";show(h);drawer(false);window.scrollTo(0,0)}
document.addEventListener("click",function(e){var b=e.target.closest("[data-done]");if(!b)return;var n=+b.dataset.done,i=done.indexOf(n);if(i>=0)done.splice(i,1);else done.push(n);save();paint()});
var idx=null;
q.addEventListener("input",function(){var s=q.value.trim().toLowerCase();if(s.length<2){show(last);return}
 if(!idx){idx=[];$$(".view[data-n]").forEach(function(v){$$(".pt",v).forEach(function(p){var c=p.cloneNode(true);$$(".ps,.src",c).forEach(function(x){x.remove()});var t=c.textContent.replace(/\s+/g," ").trim();idx.push({n:v.dataset.n,t:t,l:t.toLowerCase()})})})}
 var w=s.split(/\s+/),hits=idx.filter(function(x){return w.every(function(k){return x.l.indexOf(k)>=0})}).slice(0,60);
 $("#rt").textContent=hits.length+" results";$("#rl").innerHTML=hits.map(function(x){return'<a href="#h'+x.n+'">'+x.t.replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})+" <small>Hour "+x.n+"</small></a>"}).join("")||"<p>Nothing found.</p>";show("results")});
$("#menu").onclick=function(){drawer(!side.classList.contains("open"))};scrim.onclick=function(){drawer(false)};
window.addEventListener("hashchange",route);paint();route();
})();</script>
